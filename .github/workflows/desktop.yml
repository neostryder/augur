name: Desktop installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: '--bundles nsis,msi'
          - platform: macos-latest
            args: '--target universal-apple-darwin --bundles app,dmg'
          - platform: ubuntu-24.04
            args: '--bundles appimage,deb,rpm'
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - run: pnpm install --frozen-lockfile
      # Every installer carries the background service, so it is built first. On Windows it includes the job host, which is written in Go.
      - if: startsWith(matrix.platform, 'windows')
        uses: actions/setup-go@v7
        with:
          go-version-file: packages/augurd/native/jobhost/go.mod
          cache-dependency-path: packages/augurd/native/jobhost/go.sum
      # The macOS app is universal, so the runtime it carries is too: the arm64 and x64 builds of this Node version, checked against the release's
      # checksums, joined with lipo and signed ad hoc.
      - if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          v=$(node -v); cd "$RUNNER_TEMP"
          curl -fsSLO "https://nodejs.org/dist/$v/SHASUMS256.txt"
          for a in arm64 x64; do
            curl -fsSLO "https://nodejs.org/dist/$v/node-$v-darwin-$a.tar.gz"
            grep " node-$v-darwin-$a.tar.gz\$" SHASUMS256.txt | shasum -a 256 -c -
            tar -xzf "node-$v-darwin-$a.tar.gz"
          done
          lipo -create "node-$v-darwin-arm64/bin/node" "node-$v-darwin-x64/bin/node" -output augur-node
          codesign --force --sign - augur-node
          echo "AUGUR_NODE=$RUNNER_TEMP/augur-node" >> "$GITHUB_ENV"
      - run: pnpm build:service
      - if: github.ref_type == 'tag'
        shell: bash
        run: |
          version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then echo "Tag $GITHUB_REF_NAME does not match app version $version"; exit 1; fi
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: '-'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('desktop-{0}', github.run_number) }}
          releaseName: "Augur ${{ github.ref_type == 'tag' && github.ref_name || github.run_number }}"
          # A tagged release is published so the in-app updater can find it; a manual run stays a draft.
          releaseDraft: ${{ github.ref_type != 'tag' }}
          releaseBody: 'What changed is in [CHANGELOG.md](https://github.com/neostryder/augur/blob/main/CHANGELOG.md). The installers are not code-signed yet, so the first launch needs one extra step on Windows and macOS; the [README](https://github.com/neostryder/augur#install) shows it for each platform.'
          uploadUpdaterJson: true
          args: ${{ matrix.args }}

  # The terminal package: a tarball for Arch (it uses the system Node), a tarball for macOS (it carries its own), and the macOS install script.
  # They go on the release the installers made, and the checksum file below covers them.
  terminal:
    if: github.ref_type == 'tag'
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build and pack
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = macos-latest ]; then
            # A universal runtime: the arm64 and x64 builds of this Node version, checked against the release's checksums and joined with lipo.
            v=$(node -v); cd "$RUNNER_TEMP"
            curl -fsSLO "https://nodejs.org/dist/$v/SHASUMS256.txt"
            for a in arm64 x64; do
              curl -fsSLO "https://nodejs.org/dist/$v/node-$v-darwin-$a.tar.gz"
              grep " node-$v-darwin-$a.tar.gz\$" SHASUMS256.txt | shasum -a 256 -c -
              tar -xzf "node-$v-darwin-$a.tar.gz"
            done
            lipo -create "node-$v-darwin-arm64/bin/node" "node-$v-darwin-x64/bin/node" -output augur-node
            codesign --force --sign - augur-node
            cd "$GITHUB_WORKSPACE"
            AUGUR_NODE="$RUNNER_TEMP/augur-node" pnpm build:terminal
            pnpm pack:terminal --macos
            sh packaging/macos/test-install.sh dist/augur-terminal-*-macos.tar.gz
          else
            pnpm build:terminal
            pnpm pack:terminal
          fi
      - name: Check the version matches the tag
        shell: bash
        run: |
          version=$(cat dist/terminal/VERSION)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then echo "Tag $GITHUB_REF_NAME does not match version $version"; exit 1; fi
      - name: Upload
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" dist/augur-terminal-*.tar.gz --clobber
          if [ "${{ matrix.os }}" = macos-latest ]; then gh release upload "$GITHUB_REF_NAME" packaging/macos/install.sh --clobber; fi

  # Both PKGBUILDs are built in a clean Arch container from the files on the release (the checksums are recomputed here, since the recipe's own are
  # written once the release exists), then namcap checks them and the installed command is run.
  arch:
    if: github.ref_type == 'tag'
    needs: [build, terminal]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build -t augur-arch packaging/arch
      - name: Validate the terminal package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          mkdir -p src-terminal
          gh release download "$GITHUB_REF_NAME" --pattern "augur-terminal-$v.tar.gz" --dir src-terminal
          mkdir -p pkgbuilds
          docker run --rm -v "$PWD:/r:ro" -v "$PWD/src-terminal:/src:ro" -v "$PWD/pkgbuilds:/out" augur-arch bash /r/packaging/arch/validate.sh augur-terminal
      - name: Validate the full app package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          mkdir -p src-bin
          gh release download "$GITHUB_REF_NAME" --pattern "Augur_${v}_amd64.deb" --dir src-bin
          curl -fsSL -o "src-bin/LICENSE-$v" "https://raw.githubusercontent.com/neostryder/augur/$GITHUB_REF_NAME/LICENSE"
          mkdir -p pkgbuilds
          docker run --rm -v "$PWD:/r:ro" -v "$PWD/src-bin:/src:ro" -v "$PWD/pkgbuilds:/out" augur-arch bash /r/packaging/arch/validate.sh augur-bin
      - name: Attach the recipes with their checksums to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" pkgbuilds/PKGBUILD-augur-terminal pkgbuilds/PKGBUILD-augur-bin --clobber

  # Once every installer is on the release, attach a software bill of materials for the JavaScript and Rust dependencies and a checksum for each file.
  integrity:
    if: github.ref_type == 'tag'
    needs: [build, terminal]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: cargo install cargo-cyclonedx --locked
      - name: Build the bills of materials
        run: |
          mkdir out
          pnpm sbom --sbom-format cyclonedx --sbom-type application --lockfile-only --prod > out/augur-js.cdx.json
          cargo cyclonedx --manifest-path apps/desktop/src-tauri/Cargo.toml --format json --override-filename augur-rust
          mv apps/desktop/src-tauri/augur-rust.json out/augur-rust.cdx.json
      - name: Checksum every file on the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir dl
          gh release download "$GITHUB_REF_NAME" --dir dl --clobber
          cp out/*.json dl/
          (cd dl && sha256sum * > ../out/SHA256SUMS.txt)
          gh release upload "$GITHUB_REF_NAME" out/* --clobber
