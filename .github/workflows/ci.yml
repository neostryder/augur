name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @augur/core typecheck
      - run: pnpm --filter @augur/core test
      - run: pnpm --filter @augur/host-tauri exec tsc --noEmit
      - run: pnpm --filter @augur/ui exec tsc --noEmit
      - run: pnpm --filter @augur/ui build
      - run: pnpm --filter @augur/relay typecheck

  # The engine, the dispatch service and the terminal app run on all three systems, so their tests do too. The job host is written in Go and
  # only Windows uses it.
  workspace:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - if: startsWith(matrix.os, 'windows')
        uses: actions/setup-go@v7
        with:
          go-version-file: packages/augurd/native/jobhost/go.mod
          cache-dependency-path: packages/augurd/native/jobhost/go.sum
      - run: pnpm install --frozen-lockfile
      - if: startsWith(matrix.os, 'windows')
        run: pnpm --filter @augur/augurd build:jobhost
      - run: pnpm -r typecheck
      - run: pnpm -r test

  # The terminal package: built, packed, and put through the install script against a local copy of a release. The Linux run uses the generic
  # tarball with the Arch package's layout; the macOS run uses the one that carries its own Node.
  terminal:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: startsWith(matrix.os, 'ubuntu')
        run: |
          pnpm build:terminal
          pnpm pack:terminal
          dist/terminal/augur --help | head -n 1
          AUGURD_DATA="$RUNNER_TEMP/augurd" dist/terminal/augur status --waybar
      - if: startsWith(matrix.os, 'macos')
        run: |
          AUGUR_NODE="$(command -v node)" pnpm build:terminal
          pnpm pack:terminal --macos
          sh packaging/macos/test-install.sh dist/augur-terminal-*-macos.tar.gz

  laya:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m unittest discover -s packages/laya/tests -v

  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @augur/ui build
      - run: cargo fmt --check
        working-directory: apps/desktop/src-tauri
      - run: cargo check --locked
        working-directory: apps/desktop/src-tauri
