name: Web app

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @augur/ui build
      # wrangler.toml is not in the repository, since it names the deployer's own domain and storage.
      - name: Write the relay config
        env:
          RELAY_WRANGLER_TOML: ${{ secrets.RELAY_WRANGLER_TOML }}
        run: printf '%s\n' "$RELAY_WRANGLER_TOML" > apps/relay/wrangler.toml
      - run: pnpm --filter @augur/relay deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
