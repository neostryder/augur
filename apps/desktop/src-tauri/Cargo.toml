[package]
name = "augur"
version = "1.5.0"
description = "AI plan usage and credit balances in your tray"
authors = ["neostryder"]
license = "MIT"
repository = "https://github.com/neostryder/augur"
homepage = "https://augur.rpgm.tools"
edition = "2024"

[lib]
name = "augur_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
tauri = { version = "2.12.0", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2.5.0"
tauri-plugin-autostart = "2.6.0"
tauri-plugin-notification = "2.5.0"
tauri-plugin-opener = "2.6.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
tokio = { version = "1.53.1", features = ["fs", "process", "time", "io-util", "sync"] }
base64 = "0.23.1"
uuid = { version = "1.26.1", features = ["v4"] }
tauri-plugin-updater = "2.13.0"
tauri-plugin-process = "2.4.0"
tauri-plugin-global-shortcut = "2.4.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_Storage_FileSystem"] }
